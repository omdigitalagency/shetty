<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shetty Matka - Official App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 25px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        h1 {
            font-size: 2.2rem;
            color: #ffd700;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3);
        }

        .logo-container {
            margin: 20px 0;
            text-align: center;
        }

        .logo-container img {
            max-width: 150px;
            height: auto;
            border-radius: 10px; /* Optional: adds rounded corners to the logo image */
        }

        .rate-box {
            background: rgba(255, 215, 0, 0.15);
            border: 1px dashed #ffd700;
            border-radius: 12px;
            padding: 12px;
            margin: 20px 0;
        }

        .rate-box p {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
        }

        .tagline {
            font-size: 1.05rem;
            color: #dddddd;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .download-btn {
            display: inline-block;
            width: 100%;
            padding: 16px 0;
            background: linear-gradient(45deg, #ff4e50, #f9d423);
            color: #000;
            font-size: 1.2rem;
            font-weight: bold;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 5px 20px rgba(249, 212, 35, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-transform: uppercase;
        }

        .download-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(249, 212, 35, 0.6);
        }

        .download-btn:active {
            transform: translateY(1px);
        }

        .trust-badge {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #a0a0a0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Shetty Matka</h1>
        
        <div class="logo-container">
            <img src="path/to/your/logo.png" alt="Shetty Matka Logo"> <!-- Replace 'path/to/your/logo.png' with the actual path to your logo image file -->
        </div>

        <div class="rate-box">
            <p>Jodi Rate: 10 - 1000</p>
        </div>

        <p class="tagline">मार्केट का सबसे ईमानदार खाईवाल</p>

        <a href="https://shettymatka.com" class="download-btn" target="_blank">Download App</a>

        <div class="trust-badge">
            100% Safe & Secure Fast Auto Withdrawal
        </div>
    </div>

</body>
</html>
